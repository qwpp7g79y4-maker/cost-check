[package]
name = "cost-check"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["PEPAI <pep_ai@icloud.com>"]
license = "MIT OR Apache-2.0"
description = "One offline Cost Check report for ci-bill, log-bill, dd-metric-bill and rum-meter"
readme = "README.md"
repository = "https://github.com/qwpp7g79y4-maker/cost-check"
homepage = "https://github.com/qwpp7g79y4-maker/cost-check"
documentation = "https://github.com/qwpp7g79y4-maker/cost-check"
exclude = [".github/", "*-plugin/"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = "1"
serde_json = "1"
